<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6b1418"><title>Murat Sandviç | Kategori</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><style>:root{--primary:#6b1418;--cream:#fdfbf7;--text:#272321;--muted:#77716d}*{box-sizing:border-box}body{margin:0;background:#f5f0e9;color:var(--text);font:14px Montserrat,sans-serif}header{background:linear-gradient(120deg,#430a0d,#6b1418);color:white;padding:30px 18px 46px}main,.inner{max-width:980px;margin:auto}main{padding:24px 18px 70px}a{color:inherit;text-decoration:none}.back{color:#f0d77a;font-weight:700}h1{font:700 clamp(32px,6vw,52px) 'Playfair Display',serif;margin:24px 0 0}.subtitle{color:#e7cece}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.product{border:1px solid #ebdfd7;border-radius:17px;background:white;text-align:left;padding:22px;cursor:pointer;font:inherit;box-shadow:0 9px 25px #3511110b}.product:hover{transform:translateY(-2px);border-color:#6b1418}.product strong{color:#6b1418;display:block;font-size:16px;margin-bottom:9px}.product span{font-size:12px;color:#77716d;line-height:1.6}.product em{display:block;color:#6b1418;font-weight:800;font-style:normal;margin-top:14px}.badge{font-size:11px;color:#96731d;font-weight:800}footer{text-align:center;color:#77716d;padding:25px}</style><style>
.menu-card{cursor:pointer}.menu-card:focus-visible,.category-link:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.category-pages{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}.category-link{display:inline-flex;align-items:center;gap:10px;padding:12px 17px;background:white;border:1px solid #e7d9cc;border-radius:14px;color:var(--primary);font-weight:800;font-size:13px;box-shadow:0 6px 18px #4515150b}.category-link:hover{background:var(--primary);color:white}
.product-overlay{position:fixed;inset:0;z-index:9999;background:#16090bd1;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(5px)}.product-overlay.open{display:flex}.product-dialog{background:var(--cream);color:var(--text);width:min(580px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:clamp(22px,5vw,36px);box-shadow:0 28px 90px #0006;position:relative}.product-dialog h2{font:700 clamp(26px,5vw,38px) 'Playfair Display',serif;color:var(--primary);margin:14px 0}.product-dialog p{color:var(--muted);font-size:14px;line-height:1.8}.product-close{position:absolute;right:18px;top:18px;border:0;background:#eee1d8;border-radius:50%;height:36px;width:36px;cursor:pointer;font-size:24px}.product-dialog .detail-price{font-size:21px;color:var(--primary);font-weight:800;margin-top:18px}.video-box{margin-top:22px}.video-box h3{margin-bottom:12px;color:var(--primary);font-size:15px}.video-box video,.video-box iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#140c0c}
</style></head><body><header><div class="inner"><a class="back" href="index.html#menu">← Ana Menüye Dön</a><h1 id="heading">Menümüz</h1><p class="subtitle">Bir ürünün detayını incelemek için üzerine dokunun.</p></div></header><main><div class="grid" id="products"></div></main><footer>Murat Sandviç · Gaziantep</footer><div class="product-overlay" id="productOverlay" role="presentation"><div class="product-dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle" tabindex="-1"><button class="product-close" id="productClose" aria-label="Kapat">×</button><span class="badge">MURAT SANDVİÇ</span><h2 id="detailTitle"></h2><p id="detailDescription"></p><div class="detail-price" id="detailPrice"></div><div class="video-box" id="detailVideo" hidden></div></div></div><script>
window.MURAT_VIDEOS = { /* Örnek: "italyan sandviç": "https://www.youtube.com/embed/VIDEO_ID" veya "videos/italyan.mp4" */ };
(function(){const overlay=document.getElementById('productOverlay');if(!overlay)return;const close=document.getElementById('productClose');const dialog=overlay.querySelector('.product-dialog');let previousFocus=null;
function openProduct(item){previousFocus=document.activeElement;document.getElementById('detailTitle').textContent=item.name||'';document.getElementById('detailDescription').textContent=item.description||'Ürün bilgisi yakında eklenecek.';document.getElementById('detailPrice').textContent=item.price||'';const box=document.getElementById('detailVideo');box.replaceChildren();const urls=(item.videos&&item.videos.length?item.videos:[item.video||window.MURAT_VIDEOS[(item.name||'').toLocaleLowerCase('tr-TR')]]).filter(Boolean);box.hidden=!urls.length;if(urls.length){const title=document.createElement('h3');title.textContent='Tanıtım Videosu';box.append(title);urls.forEach(url=>{if(/^https:\/\/(www\.)?(youtube\.com\/embed\/|youtube-nocookie\.com\/embed\/)/.test(url)){const frame=document.createElement('iframe');frame.src=url;frame.title='Ürün videosu';frame.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';frame.allowFullscreen=true;frame.loading='lazy';box.append(frame)}else if(/^(videos\/|https:\/\/).+\.mp4(\?.*)?$/i.test(url)){const video=document.createElement('video');video.controls=true;video.preload='none';video.src=url;box.append(video)}else{box.hidden=true}})}overlay.classList.add('open');document.body.style.overflow='hidden';dialog.focus()}
function hide(){overlay.classList.remove('open');document.body.style.overflow='';document.getElementById('detailVideo').replaceChildren();previousFocus?.focus()}
close.addEventListener('click',hide);overlay.addEventListener('click',e=>{if(e.target===overlay)hide()});document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape')hide();if(e.key==='Tab'){const nodes=[...dialog.querySelectorAll('button,a,[tabindex]:not([tabindex="-1"]),video[controls]')];if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.showMuratProduct=openProduct;
})();
</script><script>const names={sandvic:'Sandviçler',kahvalti:'Kahvaltı',tost:'Tostlar',icecek:'İçecekler'};const category=new URLSearchParams(location.search).get('tur');document.getElementById('heading').textContent=names[category]||'Menümüz';fetch('urunler.json').then(r=>{if(!r.ok)throw Error('Menü yüklenemedi');return r.json()}).then(items=>{const grid=document.getElementById('products');const filtered=items.filter(i=>!names[category]||i.category===category);filtered.forEach(item=>{const btn=document.createElement('button');btn.className='product';const name=document.createElement('strong');name.textContent=item.name;const desc=document.createElement('span');desc.textContent=item.description;const price=document.createElement('em');price.textContent=item.price;btn.append(name,desc,price);btn.addEventListener('click',()=>showMuratProduct(item));grid.append(btn)})}).catch(()=>document.getElementById('products').textContent='Menü yüklenemedi. Sayfayı GitHub Pages üzerinden açın.');</script></body></html>
